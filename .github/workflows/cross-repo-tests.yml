# Cross-Repo Integration Tests
#
# PURPOSE:
# Builds ct-shell-trace-writer from this repository and runs integration tests
# defined in the sibling codetracer repo (metacraft-labs/codetracer). This
# validates that changes to the shell recorders do not break the CodeTracer
# db-backend flow tests (bash_flow_integration, zsh_flow_integration).
#
# WORKSPACE LAYOUT:
# The cross-repo test script expects both repositories side-by-side:
#
#   $GITHUB_WORKSPACE/../
#     codetracer/                        <-- cloned by this workflow
#     codetracer-native-recorder/        <-- cloned by this workflow
#     codetracer-shell-recorders/        <-- checked out by actions/checkout
#
# POLICY: All CI steps should be reproducible locally via `just` targets.
# Local equivalent:
#   just cross-test
#
# Cross-repo revision pinning:
#   Routine runs use this commit's published workspace record. Optional dispatch
#   overrides must be explicit immutable 40-hex commit SHAs and are reported.

name: Cross-Repo Integration Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

  workflow_dispatch:
    inputs:
      codetracer_ref:
        description: 'Optional immutable 40-hex codetracer commit SHA (reported override)'
        required: false
        default: ''

  # Bidirectional trigger: the codetracer repo can dispatch this event when
  # shell-recorder-related files change (e.g. db-backend Bash/Zsh support).
  #
  # Expected payload:
  #   {
  #     "event_type": "cross-repo-test",
  #     "client_payload": {
  #       "codetracer_ref": "<40-hex-commit-sha>",
  #       "triggered_by": "codetracer PR #123"
  #     }
  #   }
  repository_dispatch:
    types: [cross-repo-test]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross-repo-tests:
    runs-on: [self-hosted, nixos]
    # Cross-repo tests need access to private submodules (tree-sitter-nim)
    # in the codetracer repo, which requires the CI_TOKEN_PROVIDER_APP_ID
    # secret. Skip gracefully on forks or when the secret is not configured.
    if: ${{ github.event_name == 'repository_dispatch' || github.repository == 'metacraft-labs/codetracer-shell-recorders' }}

    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # 1. Checkout this repository (codetracer-shell-recorders)
      - name: Checkout codetracer-shell-recorders
        uses: actions/checkout@v4

      - name: Validate explicit immutable integration override
        id: integration_ref
        env:
          CODETRACER_OVERRIDE: ${{ github.event.inputs.codetracer_ref || github.event.client_payload.codetracer_ref }}
        run: |
          if [[ -n "$CODETRACER_OVERRIDE" ]]; then
            if [[ ! "$CODETRACER_OVERRIDE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "codetracer override must be an immutable 40-hex commit SHA" >&2
              exit 1
            fi
            echo "codetracer_sibling=codetracer!=$CODETRACER_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Explicit integration override: codetracer@$CODETRACER_OVERRIDE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "codetracer_sibling=codetracer" >> "$GITHUB_OUTPUT"
          fi

      # 2. Set up the dev env and clone sibling repositories.
      #
      # setup-dev-env installs nix and clones the cross-repo siblings
      # adjacent to this checkout at explicit revisions:
      #   - codetracer (with submodules; provides the db-backend flow
      #     tests and the tree-sitter-nim submodule)
      #   - codetracer-native-recorder (provides native db-backend FFI
      #     symbols consumed when codetracer's replay-server links)
      #   - codetracer-trace-format (the recorder's Cargo.toml path deps
      #     resolve to ../codetracer-trace-format/...)
      #   - codetracer-trace-format-nim (the trace-format Rust crate builds
      #     its Nim FFI entry point from ../codetracer-trace-format-nim/...)
      # Resolve routine sibling revisions from this commit's published lock record.
      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          lock-store: record-store
          manifests-ref: dev
          on-lock-override: error
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          siblings: |
            ${{ steps.integration_ref.outputs.codetracer_sibling }}
            codetracer-native-recorder
            codetracer-trace-format
            codetracer-trace-format-nim

      - name: Allow native-recorder direnv
        run: |
          cd "${GITHUB_WORKSPACE}/../codetracer-native-recorder"
          direnv allow

      # Override the codetracer/libs/codetracer-trace-format submodule with
      # the workflow-cloned sibling (already at the lock-pinned revision)
      # so the recorder and the db-backend it links against advance
      # together. Copy from the adjacent clone rather than re-resolving.
      - name: Override trace-format submodule in codetracer/libs
        run: |
          SRC="${GITHUB_WORKSPACE}/../codetracer-trace-format"
          DEST="${GITHUB_WORKSPACE}/../codetracer/libs/codetracer-trace-format"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      # 5. Generate tree-sitter-nim parser (gitignored generated file)
      #
      # Use the actual lock-pinned codetracer flake environment for parser tools.
      - name: Generate tree-sitter-nim parser
        run: |
          cd "${GITHUB_WORKSPACE}/../codetracer/libs/tree-sitter-nim"
          direnv allow "${GITHUB_WORKSPACE}/../codetracer"
          direnv exec "${GITHUB_WORKSPACE}/../codetracer" tree-sitter generate
          ls -la src/parser.c

      # 6. Run cross-repo integration tests
      - name: Run cross-repo integration tests
        run: dev-exec bash scripts/run-cross-repo-tests.sh all

      # 7. Upload test logs on failure
      - name: Upload cross-repo test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-repo-test-logs
          path: target/cross-test-logs/
          retention-days: 1
          if-no-files-found: ignore

      - name: Mirror test logs to S3 (non-blocking)
        if: failure()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: target/cross-test-logs/
          prefix: cross-repo-test-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
