name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Build, test, lint (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env
        # setup-dev-env installs nix and clones trace-format siblings
        # adjacent to this checkout. Pass explicit refs so pull-request CI
        # does not depend on a repo-workspaces lock for the base commit.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          siblings: |
            codetracer-trace-format=${{ github.base_ref || github.ref_name || 'main' }}
            codetracer-trace-format-nim=${{ github.base_ref || github.ref_name || 'main' }}

      - name: Build Nim trace-format sibling artifacts
        # The Nim FFI trace-writer static lib and ct-print are built from the
        # workflow-cloned ../codetracer-trace-format-nim sibling inside
        # THIS repo's dev shell (which provides nim/nimble/zstd headers).
        run: |
          dev-exec bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
            nimble install -y stew results
            nim c --app:staticlib --mm:arc --noMain -d:release --passC:"-fPIC" -p:src \
              -o:libcodetracer_trace_writer.a src/codetracer_trace_writer_ffi.nim
            nim c -d:release --mm:arc -p:src \
              -o:ct-print src/codetracer_ct_print.nim
          '
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"

      - name: Build
        run: dev-exec just build

      - name: Test
        run: dev-exec just test

      - name: Lint
        run: dev-exec just lint

  nix-build:
    name: Verify nix flake packages build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build default package
        run: nix build .#default
